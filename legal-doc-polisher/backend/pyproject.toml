[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-doc-polisher"
version = "0.1.0"
description = "AI-powered legal document formatting polisher"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-docx>=1.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "PyMuPDF>=1.24",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "docx2pdf>=0.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
win = ["pywin32>=310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
